name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned to the full tag: astral-sh stopped publishing floating major
      # aliases after v7.6, so `@v9` does not resolve. Both this and
      # checkout@v7 run on the node24 runtime.
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Run tests (100% branch coverage gate)
        run: uv run pytest

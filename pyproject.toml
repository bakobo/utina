[project]
name = "utina"
version = "0.0.0"
description = "A Custos evaluation engine: computes a governed domain's Constitution from its committed logs, and evaluates decisions against it."
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Bakobo" }]
keywords = ["keri", "acdc", "custos", "governance", "gard"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security :: Cryptography",
]

# Three runtime dependencies. Bakobo's error-code machinery has no dependencies of
# its own and refuses an illegal code where it is declared. keripy is the real
# KERI implementation behind `--substrate keripy`, and it is quarantined: Custos
# §1.4 axiom 2 closes the fold's inputs at three committed values, so no plane
# above the substrate may import it and tests/test_purity.py enforces that by AST
# inspection over every plane above it (this.i @343xvm). Pinned by commit, not by
# version — 2.0.0-dev6 is a moving target, and a demo that cannot be rebuilt from
# its manifest is not replayable.
dependencies = [
    "bakobo-errors",
    "keri",
]

[project.urls]
Homepage = "https://github.com/bakobo/utina"
Source = "https://github.com/bakobo/utina"
Issues = "https://github.com/bakobo/utina/issues"

[project.scripts]
utina = "utina.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.9",
    "mypy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/utina"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=utina --cov-branch --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
branch = true
source = ["utina"]
# The COIA reference implementation is vendored byte for byte from the spec repo, and
# its oracle is that repo's own normative vectors, which tests/test_coia.py runs in
# full. Holding somebody else's code to this repo's coverage gate would mean either
# editing it — making this the seventh implementation nobody checks — or writing tests
# for branches the specification already pins.
omit = ["*/utina/coia.py"]

[tool.ruff]
line-length = 96
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

# The COIA reference implementation is vendored byte for byte from the spec repo and
# pinned to it by a test, so it is exempted rather than corrected. SIM115 is a bare
# open() in its table loader; RUF001 is the fullwidth comma it MUST accept as a flag
# delimiter, which is the rule rather than a typo.
[tool.ruff.lint.per-file-ignores]
"src/utina/coia.py" = ["SIM115", "RUF001"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src/utina"]

# utina.coia is the COIA 2.0 reference implementation, vendored byte for byte from
# the spec repo and pinned to it by tests/test_coia.py. Annotating it would make this
# the seventh implementation nobody checks, so it is exempted rather than edited. The
# one call site that crosses the boundary carries a narrow ignore instead.
[[tool.mypy.overrides]]
module = "utina.coia"
ignore_errors = true
disallow_untyped_defs = false

[tool.uv.sources]
bakobo-errors = { git = "https://github.com/bakobo/errors" }
# Pinned to a branch of the fork rather than to its main, because this rev carries
# WebOfTrust/keripy#1564 — the DI2I edge operator — forward-ported ahead of the
# upstream merge. The demo's two-currents beat needs DI2I to exist at all: without
# it the toolchain refuses a seated endorser and an unseated one alike, which
# proves nothing. Repin to the fork's main once the PR lands upstream; the ported
# commits keep their identity, so that merge will be recognized rather than
# replayed. ~4z5c
keri = { git = "https://github.com/bakobo/keripy", rev = "0af11b4a52fd09e9a6abf952e6f241c959a859d9" }

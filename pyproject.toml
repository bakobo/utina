[project]
name = "utina"
version = "0.0.0"
description = "A Custos evaluation engine: computes a governed domain's Constitution from its committed logs, and evaluates decisions against it."
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Bakobo" }]
keywords = ["keri", "acdc", "custos", "governance", "gard"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security :: Cryptography",
]

# utina.fold has no runtime dependencies, and a test enforces it. Custos §1.4
# axiom 2 closes the fold's inputs at three committed values, so the evaluator
# needs no KERI library: producing those values from CESR streams is the
# substrate's job. keripy arrives as a substrate-only dependency when the
# substrate commission lands; until then the facade backend is pure Python.
dependencies = []

[project.urls]
Homepage = "https://github.com/bakobo/utina"
Source = "https://github.com/bakobo/utina"
Issues = "https://github.com/bakobo/utina/issues"

[project.scripts]
utina = "utina.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.9",
    "mypy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/utina"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=utina --cov-branch --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
branch = true
source = ["utina"]

[tool.ruff]
line-length = 96
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src/utina"]

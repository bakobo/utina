[project]
name = "utina"
version = "0.0.0"
description = "A Custos evaluation engine: computes a governed domain's Constitution from its committed logs, and evaluates decisions against it."
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Bakobo" }]
keywords = ["keri", "acdc", "custos", "governance", "gard"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security :: Cryptography",
]

# Two runtime dependencies. Bakobo's error-code machinery has no dependencies of
# its own and refuses an illegal code where it is declared. keripy is the real
# KERI implementation behind `--substrate keripy`, and it is quarantined: Custos
# §1.4 axiom 2 closes the fold's inputs at three committed values, so no plane
# above the substrate may import it and tests/test_purity.py enforces that by AST
# inspection over utina.fold, utina.enact, utina.acme and utina.cli (this.i
# @343xvm). Pinned by commit, not by version — 2.0.0-dev6 is a moving target, and
# a demo that cannot be rebuilt from its manifest is not replayable.
dependencies = [
    "bakobo-errors",
    "keri",
]

[project.urls]
Homepage = "https://github.com/bakobo/utina"
Source = "https://github.com/bakobo/utina"
Issues = "https://github.com/bakobo/utina/issues"

[project.scripts]
utina = "utina.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.9",
    "mypy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/utina"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=utina --cov-branch --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
branch = true
source = ["utina"]

[tool.ruff]
line-length = 96
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src/utina"]

[tool.uv.sources]
bakobo-errors = { git = "https://github.com/bakobo/errors" }
keri = { git = "https://github.com/bakobo/keripy", rev = "7da1e64a1df971ab34d622e2f30c541e7c48305c" }
